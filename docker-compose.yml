services:
  creneau:
    # Preview-only combo: :canary image + SEED_ON_INIT seeds the named volume
    # with demo data on first boot. Production uses :X.Y.Z/:latest WITHOUT
    # SEED_ON_INIT (see AGENTS.md Deployment).
    image: ghcr.io/pierrewagou/creneau:canary
    ports:
      - '3000:3000'
    volumes:
      - creneau-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/creneau.db
      - SEED_ON_INIT=true
      - SMTP_HOST=stalwart
      - SMTP_PORT=465
      - SMTP_USER=pierrewagou
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=noreply-creneau@wagou.fr
    restart: unless-stopped

volumes:
  creneau-data:
