openapi: 3.1.0

info:
  title: Créneau API
  version: 0.1.0
  description: |
    REST API for **Créneau**, a shared parking spot booking app for apartment buildings.

    ## Authentication

    Most endpoints require an authenticated session. Log in via `POST /api/auth/login`
    to receive a `session` cookie, then include it in subsequent requests.

    ## Date/time format

    All datetime values are ISO 8601 strings without timezone (local time assumed),
    e.g. `"2026-06-22T14:00:00"`. Dates are `"YYYY-MM-DD"`.

servers:
  - url: http://localhost:5173
    description: Local development
  - url: https://creneau.wagou.fr
    description: Production

security: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie obtained from `POST /api/auth/login`

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Non autorisé"

    SpotConflict:
      type: object
      description: A spot that is currently held by another lot (needs confirmation to move)
      required: [spotNumber, currentFlat]
      properties:
        spotNumber:
          type: string
          example: "36"
        currentFlat:
          type: string
          description: Lot currently holding the spot. A rebind that would leave it with 0 spots is always refused.
          example: "A01"

    AvailableSlot:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          description: ISO datetime string
          example: "2026-06-22T08:00:00"
        end:
          type: string
          description: ISO datetime string
          example: "2026-06-22T18:00:00"

    BookingWithFlat:
      type: object
      required: [id, spotNumber, flatNumber, startTime, endTime, createdAt]
      properties:
        id:
          type: integer
          example: 42
        spotNumber:
          type: string
          example: "36"
        flatNumber:
          type: string
          example: "A01"
        startTime:
          type: string
          description: ISO datetime string
          example: "2026-06-22T08:00:00"
        endTime:
          type: string
          description: ISO datetime string
          example: "2026-06-22T18:00:00"
        note:
          type: string
          nullable: true
          example: "Livraison meubles"
        createdAt:
          type: string
          description: ISO datetime string
          example: "2026-06-20T10:00:00"
        flatDisplayName:
          type: string
          nullable: true
          example: "Dupont"

    SpotTimeline:
      type: object
      required: [bookings, available]
      properties:
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/BookingWithFlat'
        available:
          type: array
          items:
            $ref: '#/components/schemas/AvailableSlot'

    CalendarDayStatus:
      type: object
      required: [date, status]
      properties:
        date:
          type: string
          description: ISO date string
          example: "2026-06-22"
        status:
          type: string
          enum: [free, partial, full]
          description: >
            `free` — no bookings on this day,
            `partial` — some slots remain,
            `full` — no available slots

    FlatAdmin:
      description: Flat record returned by GET /api/admin/flats (no pinHash)
      type: object
      required: [number, status, isAdmin]
      properties:
        number:
          type: string
          example: "A01"
        status:
          type: string
          enum: [inactive, pending, active]
          description: Stored lifecycle status (invitation TTL is derived, not stored)
          example: "active"
        displayName:
          type: string
          nullable: true
          example: "Dupont"
        activationCode:
          type: string
          nullable: true
          example: "A1B2"
        activationCodeExpiresAt:
          type: string
          nullable: true
          example: "2026-06-23T10:00:00"
        isAdmin:
          type: boolean
          example: false
        activatedAt:
          type: string
          nullable: true
          example: "2026-06-01T09:00:00"
        createdAt:
          type: string
          example: "2026-05-01T10:00:00"

    FlatFull:
      description: Full flat record returned by admin mutation endpoints (includes pinHash)
      allOf:
        - $ref: '#/components/schemas/FlatAdmin'
        - type: object
          properties:
            pinHash:
              type: string
              nullable: true
              description: Argon2 hash of the PIN (included for completeness; treat as opaque)

    SessionFlat:
      type: object
      required: [number, isAdmin]
      properties:
        number:
          type: string
          example: "A01"
        displayName:
          type: string
          nullable: true
          example: "Dupont"
        isAdmin:
          type: boolean
          example: false

    Spot:
      type: object
      required: [number, createdAt]
      properties:
        number:
          type: string
          example: "36"
        description:
          type: string
          nullable: true
          example: "Côté rue"
        createdAt:
          type: string
          example: "2026-05-01T10:00:00"

    RequestRecord:
      type: object
      description: Access request; joined contact/spot lists only where noted
      required: [id, flatNumber, status, createdAt]
      properties:
        id:
          type: integer
          example: 3
        flatNumber:
          type: string
          example: "B07"
        requesterName:
          type: string
          nullable: true
          example: "Famille Martin"
        status:
          type: string
          enum: [pending, approved, rejected]
          example: "pending"
        reviewedBy:
          type: string
          nullable: true
          description: Reviewing admin's flat number (plain text, not a relation)
          example: "B12"
        reviewedAt:
          type: string
          nullable: true
          example: "2026-06-02T09:30:00"
        createdAt:
          type: string
          example: "2026-06-01T18:00:00"
        emails:
          type: array
          items:
            type: string
        phones:
          type: array
          items:
            type: string
        requestedSpots:
          type: array
          items:
            type: string
          example: ["36"]

tags:
  - name: Authentication
    description: Login, logout, first-time activation, and initial setup
  - name: Account
    description: Display name and PIN management for the authenticated flat
  - name: Bookings
    description: Create, update, and cancel parking spot reservations
  - name: Availability
    description: Spot timeline and per-day calendar status
  - name: Admin — Flats
    description: Flat lifecycle management (admin only)
  - name: Admin — Requests
    description: Access request review — approve, edit, reject (admin only)
  - name: Admin — Spots
    description: Parking spot management (admin only)
  - name: Flats
    description: Public flat display-name lookup
  - name: Requests
    description: Public flat access requests
  - name: System
    description: Health check and real-time SSE event stream

paths:
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      description: |
        Authenticate with flat number and PIN. Sets a `session` cookie on success.
        Rate-limited to 5 attempts per 15 minutes per flat number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flatNumber, pin]
              properties:
                flatNumber:
                  type: string
                  example: "A01"
                pin:
                  type: string
                  minLength: 4
                  maxLength: 6
                  example: "1234"
      responses:
        '200':
          description: Login successful. Sets `session` cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  flat:
                    $ref: '#/components/schemas/SessionFlat'
        '400':
          description: Missing fields or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid flat number or PIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Numéro d'appartement ou PIN invalide"
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Trop de tentatives. Réessayez dans 15 minute(s)."

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      description: Clears the session cookie. Always returns 200 even if not logged in.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/auth/activate:
    post:
      tags: [Authentication]
      summary: Activate a flat
      description: |
        First-time activation. The admin generates an activation code and shares it
        with the resident, who calls this endpoint to set their PIN and activate the account.
        Rate-limited to 5 attempts per 15 minutes per flat number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flatNumber, activationCode, pin]
              properties:
                flatNumber:
                  type: string
                  example: "A01"
                activationCode:
                  type: string
                  description: 4-character alphanumeric code generated by the admin
                  example: "A1B2"
                pin:
                  type: string
                  minLength: 4
                  maxLength: 6
                  description: Digits only
                  example: "1234"
                displayName:
                  type: string
                  nullable: true
                  maxLength: 50
                  description: Resident's name (optional)
                  example: "Dupont"
      responses:
        '200':
          description: Activation successful. Sets `session` cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  flat:
                    $ref: '#/components/schemas/SessionFlat'
        '400':
          description: Missing fields, invalid PIN format, or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid flat number or activation code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Flat already activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Cet appartement a déjà été activé"
        '410':
          description: Activation code expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Code d'activation expiré. Contactez votre administrateur."
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/setup:
    post:
      tags: [Authentication]
      summary: First-time setup
      description: |
        Creates the initial admin account. Only works when no flats exist in the database.
        Subsequent calls return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flatNumber, pin]
              properties:
                flatNumber:
                  type: string
                  example: "B12"
                pin:
                  type: string
                  minLength: 4
                  maxLength: 6
                  example: "0000"
                displayName:
                  type: string
                  nullable: true
                  maxLength: 50
                  example: "Admin"
      responses:
        '200':
          description: Setup successful. Sets `session` cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  flat:
                    $ref: '#/components/schemas/SessionFlat'
        '400':
          description: Missing fields, invalid PIN, or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Application already configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "L'application est déjà configurée"

  /api/account:
    patch:
      tags: [Account]
      summary: Update display name
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  nullable: true
                  maxLength: 50
                  description: Set to null or empty string to clear
                  example: "Dupont"
      responses:
        '200':
          description: Display name updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: No valid fields, name too long, or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Account]
      summary: Change PIN
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPin, newPin]
              properties:
                currentPin:
                  type: string
                  example: "1234"
                newPin:
                  type: string
                  minLength: 4
                  maxLength: 6
                  example: "5678"
      responses:
        '200':
          description: PIN changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Missing fields, wrong current PIN, invalid new PIN, or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flat not found (no PIN hash in DB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/bookings:
    post:
      tags: [Bookings]
      summary: Create a booking
      security:
        - cookieAuth: []
      description: |
        Creates a parking spot reservation. The booking is rejected if:
        - `startTime` is in the past
        - The spot does not exist
        - The time range is outside `[00:00, 24:00]`
        - The duration exceeds 7 days
        - The slot overlaps with an existing booking on the same spot

        Broadcasts a `booking_created` SSE event to all connected clients on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spotNumber, startTime, endTime]
              properties:
                spotNumber:
                  type: string
                  example: "36"
                startTime:
                  type: string
                  description: ISO datetime string
                  example: "2026-06-23T08:00:00"
                endTime:
                  type: string
                  description: ISO datetime string
                  example: "2026-06-23T18:00:00"
                note:
                  type: string
                  nullable: true
                  example: "Livraison meubles"
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    $ref: '#/components/schemas/BookingWithFlat'
        '400':
          description: Missing fields, past date, invalid time range, or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slot already booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Ce créneau est déjà réservé"

  /api/bookings/{id}:
    patch:
      tags: [Bookings]
      summary: Update a booking
      security:
        - cookieAuth: []
      description: |
        Update the time range of an existing booking. Only the booking owner can update it.
        Broadcasts a `booking_updated` SSE event on success.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startTime, endTime]
              properties:
                startTime:
                  type: string
                  example: "2026-06-23T09:00:00"
                endTime:
                  type: string
                  example: "2026-06-23T17:00:00"
      responses:
        '200':
          description: Booking updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    $ref: '#/components/schemas/BookingWithFlat'
        '400':
          description: Invalid ID, missing fields, past date, or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the booking owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: New time slot conflicts with another booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Bookings]
      summary: Cancel a booking
      security:
        - cookieAuth: []
      description: |
        Cancel a booking. The booking owner or an admin can cancel.
        Past bookings (already ended) cannot be cancelled.
        Broadcasts a `booking_cancelled` SSE event on success.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 42
      responses:
        '200':
          description: Booking cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid ID or booking already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the booking owner (and not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/timeline:
    get:
      tags: [Availability]
      summary: Get spot timeline
      security:
        - cookieAuth: []
      description: |
        Returns existing bookings and available slots for a specific spot and date range.
        Available slots are computed by subtracting bookings from the full `[00:00, 24:00]`
        window for each day. Consecutive free days are merged into a single slot.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
          description: Start date (YYYY-MM-DD)
          example: "2026-06-22"
        - name: to
          in: query
          required: true
          schema:
            type: string
          description: End date (YYYY-MM-DD)
          example: "2026-06-28"
        - name: spot
          in: query
          required: true
          schema:
            type: string
          description: Spot number
          example: "36"
      responses:
        '200':
          description: Spot timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotTimeline'
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Paramètres from/to/spot requis"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar-statuses:
    get:
      tags: [Availability]
      summary: Get per-day calendar status
      security:
        - cookieAuth: []
      description: |
        Returns a `free` / `partial` / `full` status for each day in the requested range.
        Used for color-coding the date picker calendar cells.
        If `spot` is omitted, statuses aggregate across all spots.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
          description: Start date (YYYY-MM-DD)
          example: "2026-06-01"
        - name: to
          in: query
          required: true
          schema:
            type: string
          description: End date (YYYY-MM-DD)
          example: "2026-09-30"
        - name: spot
          in: query
          required: false
          schema:
            type: string
          description: Spot number filter (optional)
          example: "36"
      responses:
        '200':
          description: Calendar statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  statuses:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalendarDayStatus'
        '400':
          description: Missing from or to parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/flats:
    get:
      tags: [Admin — Flats]
      summary: List all flats
      security:
        - cookieAuth: []
      description: Returns all flats with their lifecycle state. Does not include `pinHash`.
      responses:
        '200':
          description: List of flats
          content:
            application/json:
              schema:
                type: object
                properties:
                  flats:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlatAdmin'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Admin — Flats]
      summary: Create a flat
      security:
        - cookieAuth: []
      description: Creates a flat in the `Inactif` state (no activation code, no PIN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number]
              properties:
                number:
                  type: string
                  example: "A05"
      responses:
        '201':
          description: Flat created
          content:
            application/json:
              schema:
                type: object
                properties:
                  flat:
                    $ref: '#/components/schemas/FlatFull'
        '400':
          description: Missing flat number or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/flats/{number}:
    patch:
      tags: [Admin — Flats]
      summary: Update a flat
      security:
        - cookieAuth: []
      description: |
        Partial update — only the keys present in the body are applied.
        `emails` and `phones` are each validated and persisted independently.
        `spotNumbers` rebinds the lot's spots; see `force` below.
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
          example: "A01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isAdmin:
                  type: boolean
                  example: true
                displayName:
                  type: string
                  nullable: true
                  example: "Dupont"
                pin:
                  type: string
                  description: New PIN (validated, stored as an Argon2 hash)
                  example: "1234"
                emails:
                  type: array
                  items:
                    type: string
                  example: ["a01@test.com"]
                phones:
                  type: array
                  items:
                    type: string
                  example: ["+33612345678"]
                spotNumbers:
                  type: array
                  description: Full desired list of spot numbers (trims, zero-pads, dedupes)
                  items:
                    type: string
                  example: ["01", "36"]
                force:
                  type: boolean
                  description: |
                    Confirm the rebind despite conflicts. Without it, conflicting spots
                    answer `409` with the `conflicts` array. Even forced, a rebind is
                    refused if it would leave the source lot with 0 spots.
                  example: false
      responses:
        '200':
          description: Flat updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  flat:
                    $ref: '#/components/schemas/FlatFull'
        '400':
          description: No valid fields, bad PIN, invalid contact, or a lot with no spots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Spot conflict (unforced) or a rebind that would strand a lot at 0 spots.
            The conflict case includes `conflicts` for the client-side resolver.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      conflicts:
                        type: array
                        items:
                          $ref: '#/components/schemas/SpotConflict'
    delete:
      tags: [Admin — Flats]
      summary: Delete a flat
      security:
        - cookieAuth: []
      description: |
        Permanently deletes a flat and all associated bookings and sessions (cascade).
        An admin cannot delete their own flat.
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
          example: "A01"
      responses:
        '200':
          description: Flat deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Cannot delete own flat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Impossible de supprimer votre propre appartement"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/flats/{number}/activation:
    post:
      tags: [Admin — Flats]
      summary: Generate activation code
      security:
        - cookieAuth: []
      description: |
        Generates a 4-character activation code valid for 24 hours.
        Transitions the flat from `Inactif` → `En attente`.
        Can be called multiple times to refresh an expired code.
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
          example: "A01"
      responses:
        '200':
          description: Activation code generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  flat:
                    $ref: '#/components/schemas/FlatFull'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Flat is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Admin — Flats]
      summary: Revoke activation code
      security:
        - cookieAuth: []
      description: |
        Revokes a pending activation code.
        Transitions the flat from `En attente` → `Inactif`.
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
          example: "A01"
      responses:
        '200':
          description: Activation code revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  flat:
                    $ref: '#/components/schemas/FlatFull'
        '400':
          description: No activation code to revoke
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Flat is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/flats/{number}/reset:
    post:
      tags: [Admin — Flats]
      summary: Reset a flat
      security:
        - cookieAuth: []
      description: |
        Resets an active flat back to `Inactif`. Clears PIN, activation code, display name,
        and all active sessions. Requires explicit confirmation.
        An admin cannot reset their own account.
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
          example: "A01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  description: Must be `true`
                  example: true
      responses:
        '200':
          description: Flat reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  flat:
                    $ref: '#/components/schemas/FlatFull'
        '400':
          description: Missing confirmation, flat not active, or cannot reset own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/spots:
    post:
      tags: [Admin — Spots]
      summary: Create a parking spot
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number]
              properties:
                number:
                  type: string
                  example: "36"
                description:
                  type: string
                  nullable: true
                  example: "Côté rue"
                force:
                  type: boolean
                  description: |
                    Reclaim a spot that is already bound to another lot. Without it, a
                    bound spot answers `409` with `conflicts`. Even forced, creating a
                    spot is refused if it would leave the holder lot with 0 spots.
                  example: false
      responses:
        '201':
          description: Spot created
          content:
            application/json:
              schema:
                type: object
                properties:
                  spot:
                    $ref: '#/components/schemas/Spot'
        '400':
          description: Missing spot number or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The spot already exists (duplicate), it is bound to another lot and `force`
            is not set (with `conflicts`), or a forced reclaim would strand a lot.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      conflicts:
                        type: array
                        items:
                          $ref: '#/components/schemas/SpotConflict'

  /api/health:
    get:
      tags: [System]
      summary: Health check
      description: Returns `ok` if the database is reachable. No authentication required.
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Service indisponible"

  /api/events:
    get:
      tags: [System]
      summary: Real-time event stream (SSE)
      security:
        - cookieAuth: []
      description: |
        Opens a **Server-Sent Events** stream for real-time booking updates.

        > **Note:** This endpoint cannot be tested interactively in this UI.
        > Use `curl -N` or an `EventSource` client in your browser:
        > ```js
        > const es = new EventSource('/api/events')
        > es.addEventListener('booking_created', e => console.log(JSON.parse(e.data)))
        > ```

        **Events emitted:**

        | Event | Data |
        |---|---|
        | `connected` | `{ clientId: string }` — sent once on connect |
        | `booking_created` | `BookingWithFlat` |
        | `booking_cancelled` | `{ id: number }` |
        | `booking_updated` | `BookingWithFlat` |
      parameters:
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            default: text/event-stream
      responses:
        '200':
          description: SSE stream established
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE messages
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/flats/{number}:
    get:
      tags: [Flats]
      summary: Public display-name lookup
      description: |
        Powers the activation screen. Returns only `number` + `displayName` —
        no contacts, codes, or PIN material. No auth required.
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
          example: "A01"
      responses:
        '200':
          description: Flat found
          content:
            application/json:
              schema:
                type: object
                required: [number]
                properties:
                  number:
                    type: string
                    example: "A01"
                  displayName:
                    type: string
                    nullable: true
                    example: "Dupont"
        '400':
          description: Missing lot number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requests:
    post:
      tags: [Requests]
      summary: Submit a flat access request
      description: |
        Public endpoint (no auth). The lot must not exist yet and every spot
        must already exist. Rate-limited per lot number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flatNumber, spotNumbers, emails, phones]
              properties:
                flatNumber:
                  type: string
                  example: "B07"
                spotNumbers:
                  type: array
                  items:
                    type: string
                  example: ["36"]
                requesterName:
                  type: string
                  nullable: true
                  example: "Famille Martin"
                emails:
                  type: array
                  items:
                    type: string
                  example: ["b07@test.com"]
                phones:
                  type: array
                  items:
                    type: string
                  example: ["+33612345678"]
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: '#/components/schemas/RequestRecord'
        '400':
          description: Validation error (lot/spot format, unknown spot, bad contacts) or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The lot already exists in the system
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests for this lot number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/requests:
    get:
      tags: [Admin — Requests]
      summary: List pending access requests
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequestRecord'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/requests/{id}:
    post:
      tags: [Admin — Requests]
      summary: Approve a request (creates the flat)
      security:
        - cookieAuth: []
      description: |
        Creates the flat (inactive, codeless) with contacts, rebinds the requested
        spots, and marks the request approved — atomically.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 3
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: |
                    Confirm the approval despite conflicts. Malformed or absent
                    bodies default to `false`. See the conflict contract on
                    `PATCH /admin/flats/{number}`.
                  example: false
      responses:
        '200':
          description: Request approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Demande approuvée"
        '400':
          description: Invalid ID, nonpending request data, or malformed spot list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Already handled, the lot already exists, or a spot conflict
            (unforced, with `conflicts`) / strand refusal (forced).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      conflicts:
                        type: array
                        items:
                          $ref: '#/components/schemas/SpotConflict'
    put:
      tags: [Admin — Requests]
      summary: Edit a pending request
      security:
        - cookieAuth: []
      description: |
        Partial update of a pending request's name, contacts, and spots.
        Emails/phones persist independently when present.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requesterName:
                  type: string
                  nullable: true
                emails:
                  type: array
                  items:
                    type: string
                phones:
                  type: array
                  items:
                    type: string
                spotNumbers:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Request updated (contacts and spots joined in)
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: '#/components/schemas/RequestRecord'
        '400':
          description: Invalid ID/body, bad contacts, or a request left with no spots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Request already handled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Admin — Requests]
      summary: Reject a pending request
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 3
      responses:
        '200':
          description: Request rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Request already handled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/spots/swap:
    post:
      tags: [Admin — Spots]
      summary: Swap a spot's owning lot
      security:
        - cookieAuth: []
      description: |
        Moves a shared spot onto a lot, optionally exchanging it with one of the
        lot's spots (which returns to the pool). The source lot is never
        stranded at 0 spots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spotNumber, flatNumber]
              properties:
                spotNumber:
                  type: string
                  description: Shared pool spot to assign
                  example: "36"
                flatNumber:
                  type: string
                  description: Lot receiving the spot
                  example: "A01"
                targetSpotNumber:
                  type: string
                  description: Lot spot exchanged back to the pool (optional)
                  example: "10"
      responses:
        '200':
          description: Spots swapped
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Missing/invalid parameters or spots in the wrong state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Spot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The swap would strand a lot at 0 spots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/flats/{number}/activation/send:
    post:
      tags: [Admin — Flats]
      summary: Resend the activation email
      security:
        - cookieAuth: []
      description: |
        Emails the flat's existing (unexpired) activation code. Never fails hard:
        `emailSent` is `false` when SMTP is unconfigured, no addresses are
        registered, or delivery fails — the code itself is unaffected.
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
          example: "A01"
      responses:
        '200':
          description: Attempt recorded
          content:
            application/json:
              schema:
                type: object
                required: [emailSent]
                properties:
                  emailSent:
                    type: boolean
                    example: true
                  emails:
                    type: array
                    items:
                      type: string
                    example: ["a01@test.com"]
        '400':
          description: Lot is active or has no code to send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Invitation expired — generate a new link instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
