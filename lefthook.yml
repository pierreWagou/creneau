pre-commit:
  jobs:
    - name: biome
      run: npx biome check --write .
      stage_fixed: true
    - name: svelte-check
      run: npm run check

pre-push:
  jobs:
    - name: gitleaks
      run: gitleaks git .
    - name: unit-tests
      run: npm run test
    - name: lockfile-sync
      # Pinned to the project's toolchain (mise → npm 10, same as CI):
      # system npm 11 silently tolerates lockfile desync that npm 10's ci rejects.
      run: mise exec -- npm ci --dry-run
