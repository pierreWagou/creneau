name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'production' || 'preview' }}
      url: ${{ github.event_name == 'release' && 'https://creneau.wagou.fr' || 'https://creneau-preview.wagou.fr' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            ${{ github.event_name == 'release' && 'type=semver,pattern={{version}}' || '' }}
            ${{ github.event_name == 'release' && 'type=semver,pattern={{major}}.{{minor}}' || '' }}
            ${{ github.event_name == 'release' && 'type=raw,value=latest' || 'type=raw,value=canary' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy
        run: curl -s -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
